<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png?v=3" />
  <link rel="shortcut icon" href="./favicon.ico?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />
  <link rel="manifest" href="./manifest.webmanifest?v=3" />
  <title>WORK FLOW · 비밀번호 재설정</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f8fafc,#eef2f7)}
    .card{width:min(100%,430px);background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 20px 60px rgba(15,23,42,.12);overflow:hidden}
    .head{padding:28px 28px 18px;border-bottom:1px solid #e2e8f0}.brand{font-weight:950;font-size:20px;letter-spacing:-.03em}.sub{margin-top:6px;color:#64748b;font-size:13px;line-height:1.55}
    .body{padding:24px 28px 28px}.note{padding:12px 13px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:12px;line-height:1.55;margin-bottom:16px}
    .msg{display:none;padding:11px 12px;border-radius:11px;margin-bottom:14px;font-size:12px;line-height:1.5}.msg.show{display:block}.msg.error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}.msg.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d}
    .field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:7px}.field input{width:100%;height:44px;border:1px solid #cbd5e1;border-radius:11px;padding:0 12px;font-size:14px;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .help{font-size:11px;color:#64748b;margin-top:6px}.btn{width:100%;height:46px;border:0;border-radius:11px;font-weight:900;font-size:14px;cursor:pointer}.primary{background:#0f172a;color:#fff}.primary:disabled{opacity:.55;cursor:default}.secondary{margin-top:9px;background:#f1f5f9;color:#334155}
    .verify{padding:26px 10px;text-align:center;color:#64748b;font-size:13px;line-height:1.6}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="brand">WORK FLOW</div>
      <div class="sub">관리자 계정 비밀번호 재설정</div>
    </div>
    <div class="body">
      <div id="verifyState" class="verify">재설정 링크를 확인하고 있습니다…</div>
      <form id="resetForm" class="hidden" autocomplete="off">
        <div class="note"><b>새 비밀번호 설정</b><br>보안을 위해 새 비밀번호는 8자 이상 입력해 주세요.</div>
        <div id="errorMsg" class="msg error"></div>
        <div id="successMsg" class="msg success"></div>
        <div class="field">
          <label for="newPassword">새 비밀번호 *</label>
          <input id="newPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="8자 이상 새 비밀번호" />
          <div class="help">현재 사용하던 비밀번호와 다른 비밀번호를 권장합니다.</div>
        </div>
        <div class="field">
          <label for="confirmPassword">새 비밀번호 확인 *</label>
          <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="새 비밀번호 다시 입력" />
        </div>
        <button id="submitBtn" class="btn primary" type="submit">새 비밀번호 설정</button>
        <button class="btn secondary" type="button" id="backBtn">로그인 화면으로</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const ADMIN_EMAIL='sk888sk9999@gmail.com';
    const RECOVERY_HINT=new URLSearchParams(location.search).get('recovery')==='1' || location.hash.includes('type=recovery');
    const $=s=>document.querySelector(s);
    const configured=Boolean(window.WORKFLOW_CONFIG?.supabaseUrl && window.WORKFLOW_CONFIG?.supabaseAnonKey);
    const db=configured ? window.supabase.createClient(window.WORKFLOW_CONFIG.supabaseUrl,window.WORKFLOW_CONFIG.supabaseAnonKey) : null;
    let recoveryReady=false;

    function showError(msg){$('#errorMsg').textContent=msg;$('#errorMsg').classList.toggle('show',Boolean(msg))}
    function showSuccess(msg){$('#successMsg').textContent=msg;$('#successMsg').classList.toggle('show',Boolean(msg))}
    function failLink(msg){$('#verifyState').innerHTML=`${msg}<br><br><button class="btn secondary" type="button" onclick="location.href='/'">로그인 화면으로</button>`}
    async function activateRecovery(user){
      if(recoveryReady)return;
      if(!user || String(user.email||'').toLowerCase()!==ADMIN_EMAIL){failLink('관리자 계정용 비밀번호 재설정 링크가 아닙니다.');return}
      recoveryReady=true;
      $('#verifyState').classList.add('hidden');
      $('#resetForm').classList.remove('hidden');
      setTimeout(()=>$('#newPassword').focus(),80);
    }

    if(!db){failLink('Supabase 연결 정보를 확인해 주세요.');}
    else{
      db.auth.onAuthStateChange((event,session)=>{
        if(event==='PASSWORD_RECOVERY' && session?.user) activateRecovery(session.user);
        else if(event==='INITIAL_SESSION' && RECOVERY_HINT && session?.user) activateRecovery(session.user);
      });
      db.auth.getSession().then(({data})=>{
        if(RECOVERY_HINT && data.session?.user) activateRecovery(data.session.user);
        else if(!RECOVERY_HINT) failLink('유효한 비밀번호 재설정 링크로 접속해 주세요.');
        else setTimeout(()=>{if(!recoveryReady)failLink('재설정 링크가 만료되었거나 유효하지 않습니다. 비밀번호 재설정 메일을 다시 요청해 주세요.')},1200);
      }).catch(()=>failLink('재설정 링크를 확인하지 못했습니다. 다시 요청해 주세요.'));
    }

    $('#resetForm').addEventListener('submit',async e=>{
      e.preventDefault(); if(!db||!recoveryReady)return;
      showError('');showSuccess('');
      const p=$('#newPassword').value, c=$('#confirmPassword').value;
      if(p.length<8){showError('보안을 위해 새 비밀번호는 8자 이상 입력해 주세요.');$('#newPassword').focus();return}
      if(p!==c){showError('새 비밀번호 확인이 일치하지 않습니다.');$('#confirmPassword').focus();return}
      const b=$('#submitBtn');b.disabled=true;b.textContent='변경 중…';
      try{
        const {error}=await db.auth.updateUser({password:p}); if(error)throw error;
        showSuccess('비밀번호가 재설정되었습니다. 잠시 후 로그인 화면으로 이동합니다.');
        $('#newPassword').value='';$('#confirmPassword').value='';
        await db.auth.signOut();
        history.replaceState({},'',location.pathname);
        setTimeout(()=>location.replace('/?password_reset=success'),1300);
      }catch(err){console.error(err);showError('비밀번호 재설정에 실패했습니다. 재설정 메일을 다시 요청해 주세요.');b.disabled=false;b.textContent='새 비밀번호 설정'}
    });
    $('#backBtn').onclick=()=>location.href='/';
  </script>
</body>
</html>
